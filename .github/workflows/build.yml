name: Build FRMod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Montar projeto
        run: |
          mkdir -p app/src/main/java/com/frmod app/src/main/cpp
          mv Native.java Loader.java ModMenu.java app/src/main/java/com/frmod/
          mv mod.cpp app/src/main/cpp/

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(frmod)
          add_library(frmod SHARED mod.cpp)
          find_library(log-lib log)
          target_link_libraries(frmod ${log-lib} dl)
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FRMod" />
          </manifest>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FRMod"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.frmod'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.frmod.build'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Separar arquivos
        run: |
          mkdir -p out/x
          cd out/x
          unzip -q ../../app/build/outputs/apk/release/*.apk classes.dex lib/arm64-v8a/libfrmod.so
          cd ..
          cp x/classes.dex ./classes3.dex
          cp x/lib/arm64-v8a/libfrmod.so ./libfrmod.so
          rm -rf x
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: FRMod
          path: |
            out/classes3.dex
            out/libfrmod.so
